[project]
name = "mattermost-mcp-server"
version = "1.0.0"
description = "MCP server for Mattermost: read channels, threads, unreads and mentions, and (opt-in) post, reply, edit and react. Personal access token or browser-cookie auth."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thatguy" }]
keywords = ["mcp", "mattermost", "model-context-protocol", "llm", "ai-agents", "claude"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx[socks]>=0.27",
]

[project.scripts]
mattermost-mcp-server = "mattermost_mcp.server:main"
mattermost-mcp = "mattermost_mcp.server:main"

[project.urls]
Repository = "https://github.com/toffguy77/mattermost-mcp"
Issues = "https://github.com/toffguy77/mattermost-mcp/issues"
Changelog = "https://github.com/toffguy77/mattermost-mcp/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mattermost_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
