[project]
name = "mattermost-mcp"
version = "0.2.0"
description = "Read-only MCP server for Mattermost with browser-cookie auth"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thatguy" }]
keywords = ["mcp", "mattermost", "model-context-protocol", "llm"]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx[socks]>=0.27",
]

[project.scripts]
mattermost-mcp = "mattermost_mcp.server:main"

[project.urls]
Repository = "https://github.com/toffguy77/mattermost-mcp"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mattermost_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
